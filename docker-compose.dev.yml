# Use with: docker compose -f docker-compose.dev.yml up -d --build
services:
  bmw-mqtt-bridge:
    extends:
      file: docker-compose.example.yml
      service: bmw-mqtt-bridge
    build: .
    image: bmw-mqtt-bridge:dev
    pull_policy: build

# Top-level resources are not inherited by extends.
volumes:
  bmb_data_token:
