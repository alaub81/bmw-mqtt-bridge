name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install C++ test compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++
      - name: Run the same tests as before local deployment
        run: ./test-check.sh
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make
      - name: Install pinned lint dependencies
        run: |
          python -m venv .lint-venv
          .lint-venv/bin/python -m pip install --requirement requirements-lint.txt
          .lint-venv/bin/python resources/install_lint_tools.py
      - name: Run the same checks as local development
        run: ./linter-check.sh
